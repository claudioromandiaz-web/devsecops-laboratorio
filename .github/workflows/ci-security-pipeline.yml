 name: CI - Security Pipeline
 
 on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

 jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- SAST: SonarCloud ---
      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # --- SCA: Dependency Check ---
      - name: Run OWASP Dependency-Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MoviesApp"
          path: "."
          format: "CSV"
          out: "dependency-check-report"

      # --- SCA: Fail if vulnerabilities found ---
      - name: Fail if vulnerabilities found (SCA)
        if: always()
        continue-on-error: true
        run: |
          REPORT_PATH="dependency-check-report/dependency-check-report.csv"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "Report file not found!"
            exit 1
          fi

          echo "---- Head of report (debug) ----"
          head -n 10 "$REPORT_PATH" || true
          echo "---------------------------------"

          python3 - <<'PY'
            import csv, sys, re
            report = "dependency-check-report/dependency-check-report.csv"
            try:
                with open(report, newline='', encoding='utf-8') as f:
                    reader = csv.reader(f)
                    header = next(reader, None)
                    if header is None:
                        print("CSV empty or unreadable")
                        sys.exit(1)

                    hdr = [h.strip().lower() for h in header]
                    sev_names = ["severity","highest severity","vulnerability severity"]
                    pkg_names = ["package","dependency","file","file name","filename","component","identifier","module"]

                    sev_idx = None
                    pkg_idx = None
                    for i, name in enumerate(hdr):
                        if name in sev_names:
                            sev_idx = i
                        if name in pkg_names:
                            pkg_idx = i

                    if sev_idx is None or pkg_idx is None:
                        print("No pude identificar columnas 'severity' o 'package' automáticamente.")
                        print("Header detectado:", header)
                        sys.exit(1)

                    found = False
                    for row in reader:
                        if len(row) <= max(sev_idx, pkg_idx):
                            continue
                        sev = str(row[sev_idx]).strip().upper()
                        pkg = str(row[pkg_idx]).strip()
                        if re.search(r'\b(CRITICAL|HIGH|MEDIUM)\b', sev, flags=re.I):
                            print(f"{sev} {pkg}")
                            found = True

                    if not found:
                        print("No se encontraron CRITICAL/HIGH/MEDIUM luego de parseo robusto.")
                        sys.exit(1)
            except Exception as e:
                print("Error parsing CSV:", e)
                sys.exit(1)
          PY

          if [ $? -ne 0 ]; then
            echo "SCA: Vulnerabilities found or parsing error — failing step."
            exit 1
          fi

      # --- Build Docker image ---
      - name: Build Docker image
        if: always()
        run: |
          docker build -t movies-app:latest .

      # --- Image Security: Trivy Scan ---
      - name: Scan Docker image with Trivy
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "movies-app:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH,MEDIUM"
