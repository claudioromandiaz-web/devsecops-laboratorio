name: CI - Security Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- SAST: SonarCloud ---
      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # --- SCA: Dependency Check ---
      - name: Run OWASP Dependency-Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MoviesApp"
          path: "."
          format: "HTML"
          out: "dependency-check-report"

      - name: Fail if vulnerabilities found (SCA)
        if: always()
        continue-on-error: true
        run: |
          REPORT_PATH="dependency-check-report/dependency-check-report.html"
          if [ -f "$REPORT_PATH" ]; then
            if grep -q -E "CRITICAL|HIGH|MEDIUM" "$REPORT_PATH"; then
              echo "SCA: Vulnerabilities found! Failing pipeline."
              echo "---- Vulnerabilities detected ----"
              grep -E "CRITICAL|HIGH|MEDIUM" "$REPORT_PATH"
              echo "----------------------------------"
              exit 1
            else
              echo "No vulnerabilities found."
            fi
          else
            echo "Report file not found!"
            exit 1
          fi

      # --- Build Docker image ---
      - name: Build Docker image
        if: always()
        run: |
          docker build -t movies-app:latest .

      # --- Image Security: Trivy Scan ---
      - name: Scan Docker image with Trivy
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "movies-app:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH,MEDIUM"
