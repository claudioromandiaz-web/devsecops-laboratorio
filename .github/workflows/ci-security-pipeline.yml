name: CI - Security Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      # --- Clonación del código ---
      - name: Checkout code
        uses: actions/checkout@v3

      # --- SAST: SonarCloud / Simulación ---
      - name: Run SAST simulation
        run: |
          echo "Simulando vulnerabilidades SAST..."
          echo "CRITICAL src/app.js:1 Some issue"
          echo "HIGH src/index.js:5 Another issue"
          echo "MEDIUM src/utils.js:2 Minor issue"
          exit 1  # Fuerza fallo para pruebas

      # --- SCA: OWASP Dependency-Check ---
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MoviesApp"
          path: "."
          format: "CSV"
          out: "dependency-check-report"

      - name: Fail if vulnerabilities found (SCA)
        if: always()
        continue-on-error: true
        run: |
          REPORT_PATH="dependency-check-report/dependency-check-report.csv"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "Report file not found!"
            exit 1
          fi

          echo "SCA vulnerabilities:"
          any_vulns=false

          tail -n +2 "$REPORT_PATH" | while IFS=',' read -r Project ScanDate DependencyName _rest; do
            DependencyName=$(echo "$DependencyName" | tr -d '"')
            # Aquí filtramos CRITICAL/HIGH/MEDIUM
            severity=$(echo "$DependencyName" | grep -o -E "CRITICAL|HIGH|MEDIUM" || true)
            if [ -n "$severity" ]; then
              echo "$severity $DependencyName"
              any_vulns=true
            fi
          done

          if [ "$any_vulns" = true ]; then
            echo "SCA: Vulnerabilities found! Failing pipeline."
            exit 1
          else
            echo "No vulnerabilities found in SCA."

      # --- Construcción de Docker ---
      - name: Build Docker image
        run: |
          docker build -t movies-app:latest .

      # --- Image Security: Trivy ---
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "movies-app:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH,MEDIUM"
