name: CI MoviesApp Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  ci-sec:
    runs-on: ubuntu-latest
    steps:
      # 1. Clonar el repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Prueba SAST con ESLint (simulación)
      - name: Run ESLint (SAST simulation)
        run: |
          npm install eslint
          npx eslint . || (echo "SAST found issues, failing!" && exit 1)

      # 3. Prueba SCA con npm audit (simulación)
      - name: Run npm audit (SCA simulation)
        run: |
          npm install
          npm audit --audit-level=moderate || (echo "SCA found vulnerabilities, failing!" && exit 1)

      # 4. Construcción de imagen Docker
      - name: Build Docker image
        run: |
          docker build -t moviesapp:test .

      # 5. Escaneo de imagen Docker con Trivy
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: moviesapp:test
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH,MEDIUM
