name: CI - Security Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:

      # 1. Clonación del repositorio
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. SAST - ESLint
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Run ESLint SAST
        run: |
          npm install eslint@8.57.1 --save-dev
          npx eslint . || true
      - name: Fail if SAST vulnerabilities found
        run: |
          # Simular vulnerabilidades para prueba
          echo "CRITICAL src/app.js:1 Some issue"
          echo "HIGH src/index.js:5 Another issue"
          echo "MEDIUM src/utils.js:2 Minor issue"
          # Forzar fallo si hay vulnerabilidades
          exit 1

      # 3. SCA - OWASP Dependency-Check
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MoviesApp"
          path: "."
          format: "CSV"
          out: "dependency-check-report"

      - name: Fail if SCA vulnerabilities found
        run: |
          REPORT_PATH="dependency-check-report/dependency-check-report.csv"
          if [ -f "$REPORT_PATH" ]; then
            awk -F',' 'NR>1 {gsub(/"/,"",$2); gsub(/"/,"",$13); if($13 ~ /CRITICAL|HIGH|MEDIUM/) print $13, $2}' "$REPORT_PATH" | tee found_vulns.txt
            if [ -s found_vulns.txt ]; then
              echo "SCA: Vulnerabilities found! Failing pipeline."
              exit 1
            else
              echo "No vulnerabilities found."
            fi
          else
            echo "Report file not found!"
            exit 1
          fi

      # 4. Construcción de la Imagen Docker
      - name: Build Docker image
        run: docker build -t movies-app:latest .

      # 5. Image Security - Trivy
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "movies-app:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH,MEDIUM"
