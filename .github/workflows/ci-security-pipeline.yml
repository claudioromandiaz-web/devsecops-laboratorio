name: CI - Security Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- SAST: SonarCloud ---
      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # --- SCA: Dependency Check ---
      - name: Run OWASP Dependency-Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MoviesApp"
          path: "."
          format: "CSV"
          out: "dependency-check-report"

      - name: Fail if vulnerabilities found (SCA)
        if: always()
        continue-on-error: true
        run: |
          REPORT_PATH="dependency-check-report/dependency-check-report.csv"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "Report file not found!"
            exit 1
          fi

          echo "---- Head of report (debug) ----"
          head -n 6 "$REPORT_PATH" || true
          echo "---------------------------------"

          # Buscar líneas que contengan CRITICAL|HIGH|MEDIUM (case-insensitive)
          # Para cada línea, extraer la primera severidad encontrada y el DependencyName (campo 3)
          grep -iE 'CRITICAL|HIGH|MEDIUM' "$REPORT_PATH" | while IFS= read -r line; do
            # extraer severidad (preservando mayúsculas como en output esperado)
            sev=$(echo "$line" | sed -n 's/.*\([Cc][Rr][Ii][Tt][Ii][Cc][Aa][Ll]\).*/CRITICAL/p; t; s/.*\([Hh][Ii][Gg][Hh]\).*/HIGH/p; t; s/.*\([Mm][Ee][Dd][Ii][Uu][Mm]\).*/MEDIUM/p; t; q')
            # extraer DependencyName (campo 3) usando FS = '","' y limpiar comillas
            pkg=$(echo "$line" | awk -F'\",\"' '{gsub(/^"|"$/,"",$3); print $3}')
            # si pkg está vacío, intentar extraer desde el campo Identifiers o Product en su defecto
            if [ -z "$pkg" ] || [ "$pkg" = "" ]; then
              pkg=$(echo "$line" | awk -F'\",\"' '{for(i=1;i<=NF;i++){t=$i; gsub(/^"|"$/,"",t); if(t ~ /@|:[0-9]/){print t; exit}}}')
            fi
            # imprimir sólo si encontramos severidad y paquete
            if [ -n "$sev" ] && [ -n "$pkg" ]; then
              echo "$sev $pkg"
            fi
          done | tee sca_vulns.txt

          # Si sca_vulns.txt tiene contenido, fallar (exit 1) para cumplir la consigna
          if [ -s sca_vulns.txt ]; then
            echo "SCA: Vulnerabilities found! Failing pipeline."
            cat sca_vulns.txt
            exit 1
          else
            echo "No CRITICAL/HIGH/MEDIUM vulnerabilities found."
          fi

      # --- Build Docker image ---
      - name: Build Docker image
        if: always()
        run: |
          docker build -t movies-app:latest .

      # --- Image Security: Trivy Scan ---
      - name: Scan Docker image with Trivy
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "movies-app:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH,MEDIUM"
