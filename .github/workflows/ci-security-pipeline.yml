name: CI - Security Pipeline (Self-contained)

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run SAST (Simulated)
        run: |
          echo "=== SAST ==="
          echo "Simulating code analysis..."
          echo "CRITICAL issue found in app.js"
          echo "::error::SAST found CRITICAL/HIGH/MEDIUM vulnerabilities"
          exit 1

  sca:
    runs-on: ubuntu-latest
    needs: sast
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create fake dependency-check CSV (no quotes in header)
        run: |
          mkdir -p dependency-check-report
          cat > dependency-check-report/dependency-check-report.csv <<'CSV'
          DependencyName,Severity
          @google-cloud/firestore:4.15.1,CRITICAL
          @grpc/grpc-js:1.5.7,HIGH
          body-parser:1.19.2,MEDIUM
          CSV

      - name: Parse vulnerabilities and fail
        run: |
          echo "=== SCA Results ==="
          python3 - <<'PY'
          import csv, sys
          report = "dependency-check-report/dependency-check-report.csv"
          vulns = []
with open(report, newline='', encoding='utf-8') as f:
    reader = csv.DictReader(f)
    for row in reader:
        sev = row.get("Severity","").strip().upper()
        pkg = row.get("DependencyName","").strip()
        if sev in ("CRITICAL","HIGH","MEDIUM"):
            vulns.append((sev, pkg))
for sev, pkg in vulns:
    print(f"{sev} {pkg}")
if vulns:
    sys.exit(1)
else:
    sys.exit(0)
PY

  image:
    runs-on: ubuntu-latest
    needs: sca
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create Dockerfile
        run: |
          echo "FROM alpine:3.18" > Dockerfile
          echo "RUN echo 'Hello from container' > /hello.txt" >> Dockerfile
          echo 'CMD ["cat","/hello.txt"]' >> Dockerfile

      - name: Build Docker image
        run: docker build -t movies-app:test .

      - name: Simulate Trivy scan (force fail)
        run: |
          echo "=== IMAGE SCAN ==="
          echo "CRITICAL CVE-2025-0001 found in libc"
          echo "HIGH CVE-2024-1111 found in busybox"
          echo "MEDIUM CVE-2023-2222 found in apk-tools"
          echo "::error::Image scan found CRITICAL/HIGH/MEDIUM vulnerabilities"
          exit 1
