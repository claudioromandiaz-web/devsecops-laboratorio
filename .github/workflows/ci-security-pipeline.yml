name: CI - Security Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # --- SAST: SonarCloud ---
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=${{ secrets.SONAR_ORG }}
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

    - name: Fail if SonarCloud Quality Gate fails
      run: |
        STATUS=$(curl -s -u ${{ secrets.SONAR_TOKEN }}: \
          "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${{ secrets.SONAR_PROJECT_KEY }}" \
          | jq -r '.projectStatus.status')
        echo "SonarCloud Quality Gate status: $STATUS"
        if [ "$STATUS" != "OK" ]; then
          echo "SAST found vulnerabilities! Failing pipeline."
          exit 1
        fi

    # --- SCA: Dependency Check ---
    - name: Run OWASP Dependency-Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: "MoviesApp"
        path: "."
        format: "CSV"
        out: "dependency-check-report"

    - name: Fail if vulnerabilities found (SCA)
      run: |
        REPORT_PATH="dependency-check-report/dependency-check-report.csv"
        if [ -f "$REPORT_PATH" ]; then
          echo "---- Vulnerabilities detected ----"
          awk -F',' 'NR>1 {gsub(/"/,"",$2); gsub(/"/,"",$12); if($12 ~ /CRITICAL|HIGH|MEDIUM/) print $12, $2}' "$REPORT_PATH"
          if awk -F',' 'NR>1 {gsub(/"/,"",$12); if($12 ~ /CRITICAL|HIGH|MEDIUM/) exit 1}' "$REPORT_PATH"; then
            exit 1
          fi
          echo "----------------------------------"
        else
          echo "Report file not found!"
          exit 1
        fi

    # --- Build Docker image ---
    - name: Build Docker image
      run: docker build -t movies-app:latest .

    # --- Image Security: Trivy Scan ---
    - name: Scan Docker image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: "movies-app:latest"
        format: "table"
        exit-code: "1"
        severity: "CRITICAL,HIGH,MEDIUM"
