name: Movies CI/CD Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: movies-app:latest

    steps:
      # 1️⃣ Clonar repositorio
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ SAST (SonarCloud)
      - name: Set up SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.projectKey=devsecops-laboratorio
            -Dsonar.organization=your-org
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # Fail if SAST finds CRITICAL/HIGH/MEDIUM
      # SonarCloud nativamente puede marcar fallos en Quality Gate

      # 3️⃣ SCA (Dependency Check)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependency-check CLI
        run: |
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v8.3.1/dependency-check-8.3.1-release.zip
          unzip dependency-check-8.3.1-release.zip -d dependency-check
          chmod +x dependency-check/dependency-check.sh

      - name: Run dependency-check
        run: |
          ./dependency-check/dependency-check.sh --project MoviesApp \
            --scan ./functions \
            --format "CSV" \
            --out ./dependency-check-report

      - name: Fail if vulnerabilities found (Dependency Check)
        run: |
          python3 - << 'EOF'
          import csv
          import sys
          REPORT_PATH = "dependency-check-report/dependency-check-report.csv"
          SEVERITIES = {"CRITICAL", "HIGH", "MEDIUM"}
          with open(REPORT_PATH, newline='', encoding='utf-8') as csvfile:
              reader = csv.DictReader(csvfile)
              vulns_found = []
              for row in reader:
                  for col in ["CVSSv2_Severity", "CVSSv3_BaseSeverity", "CVSSv4_BaseSeverity"]:
                      if row.get(col, "").strip().upper() in SEVERITIES:
                          vulns_found.append(row)
                          break
          if vulns_found:
              print(f"SCA: {len(vulns_found)} vulnerabilities found!")
              for v in vulns_found:
                  print(f"- {v.get('DependencyName','')} | Severity: {v.get('CVSSv2_Severity','')}/{v.get('CVSSv3_BaseSeverity','')}/{v.get('CVSSv4_BaseSeverity','')}")
              sys.exit(1)
          else:
              print("No CRITICAL/HIGH/MEDIUM vulnerabilities found.")
EOF

      # 4️⃣ Build Docker image
      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE .

      # 5️⃣ Image Security (Trivy)
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar
          wget https://github.com/aquasecurity/trivy/releases/download/v0.44.0/trivy_0.44.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.44.0_Linux-64bit.deb

      - name: Scan Docker image with Trivy
        run: |
          trivy image --severity CRITICAL,HIGH,MEDIUM $DOCKER_IMAGE

