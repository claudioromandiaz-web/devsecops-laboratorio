name: CI - Security Pipeline
on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      # --- Clonar repositorio ---
      - name: Checkout code
        uses: actions/checkout@v3

      # --- SAST: Simulación de SonarCloud ---
      - name: SonarCloud Scan
        continue-on-error: true
        run: |
          echo "Simulando vulnerabilidades SAST"
          echo "CRITICAL src/app.js:1 Some issue"
          echo "HIGH src/index.js:5 Another issue"
          echo "MEDIUM src/utils.js:2 Minor issue"
          exit 1

      # --- SCA: Dependency Check ---
      - name: Run OWASP Dependency-Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MoviesApp"
          path: "."
          format: "CSV"
          out: "dependency-check-report"

      - name: Fail if vulnerabilities found (SCA)
        if: always()
        continue-on-error: true
        run: |
          REPORT_PATH="dependency-check-report/dependency-check-report.csv"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "Report file not found!"
            exit 1
          fi

          echo "SCA vulnerabilities:"
          any_vulns=false

          awk -F',' '
            NR>1 {
              pkg=""
              if($0 ~ /CRITICAL|HIGH|MEDIUM/){
                for(i=1;i<=NF;i++){
                  if($i ~ /@?[a-zA-Z0-9._\-]+:[0-9]+\.[0-9]+/){
                    gsub(/"/,"",$i)
                    pkg=$i
                    break
                  }
                }
                if(pkg!=""){
                  if($0 ~ /CRITICAL/){sev="CRITICAL"}
                  else if($0 ~ /HIGH/){sev="HIGH"}
                  else if($0 ~ /MEDIUM/){sev="MEDIUM"}
                  print sev " " pkg
                  any_vulns=true
                }
              }
            }
          ' "$REPORT_PATH"

          if [ "$any_vulns" = true ]; then
            echo "SCA: Vulnerabilities found! Failing pipeline."
            exit 1
          else
            echo "No vulnerabilities found in SCA."
          fi

      # --- Build Docker image ---
      - name: Build Docker image
        if: always()
        run: |
          docker build -t movies-app:latest .

      # --- Image Security: Trivy Scan ---
      - name: Scan Docker image with Trivy
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "movies-app:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH,MEDIUM"
