name: CI MoviesApp Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: MoviesApp
      REPORT_PATH: dependency-check-report/dependency-check-report.csv
      DOCKER_IMAGE: moviesapp:latest

    steps:
    # 1. Clonar repositorio
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Ejecutar SAST con SonarCloud
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      with:
        projectKey: ${{ github.repository }}
        organization: your-org
        token: ${{ secrets.SONAR_TOKEN }}
    - name: Check Sonar Quality Gate
      run: |
        STATUS=$(curl -s -u ${{ secrets.SONAR_TOKEN }} https://sonarcloud.io/api/qualitygates/project_status?projectKey=${{ github.repository }} | jq -r '.projectStatus.status')
        echo "Quality Gate Status: $STATUS"
        if [ "$STATUS" != "OK" ]; then
          echo "SAST detected critical/high/medium issues. Failing pipeline."
          exit 1
        fi

    # 3. Ejecutar SCA con Dependency-Check
    - name: Setup Dependency-Check
      uses: OWASP/dependency-check-action@v2
      with:
        project: ${{ env.PROJECT_NAME }}
        scan: .
        format: "ALL"
        out: dependency-check-report
    - name: Fail on vulnerabilities
      run: |
        CSV=${{ env.REPORT_PATH }}
        awk -F, 'NR>1 && ($17=="CRITICAL" || $17=="HIGH" || $17=="MEDIUM") {exit 1}' $CSV || true
        if [ $? -eq 1 ]; then
          echo "SCA detected CRITICAL/HIGH/MEDIUM vulnerabilities. Failing pipeline."
          exit 1
        fi

    # 4. Construcción de imagen Docker
    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE }} .

    # 5. Image Security con Trivy
    - name: Scan Docker image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_IMAGE }}
        format: table
        exit-code: 1
        severity: CRITICAL,HIGH,MEDIUM
