name: CI - Security Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- SAST: SonarCloud ---
      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # --- SCA: OWASP Dependency-Check ---
      - name: Run OWASP Dependency-Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MoviesApp"
          path: "."
          format: "CSV"
          out: "dependency-check-report"

      # --- SCA: Fail if vulnerabilities found ---
      - name: Fail if vulnerabilities found (SCA)
        if: always()
        continue-on-error: true
        run: |
          REPORT_PATH="dependency-check-report/dependency-check-report.csv"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "Report file not found!"
            exit 1
          fi

          echo "---- Head of report (debug) ----"
          head -n 6 "$REPORT_PATH" || true
          echo "---------------------------------"

          awk -F'","' '
          BEGIN {
            IGNORECASE=1
            found=0
          }
          NR==1 {
            # Guardar índices de todas las columnas con "severity"
            for(i=1;i<=NF;i++){
              h = $i
              gsub(/^"|"$/, "", h)
              if(h ~ /severity/) sev_cols[i]=1
              if(h ~ /package|dependency|name|product/) pkg_col=i
            }
            next
          }
          {
            for(i in sev_cols){
              sev = $i
              gsub(/^"|"$/, "", sev)
              if(sev ~ /(CRITICAL|HIGH|MEDIUM)/i){
                pkg = $pkg_col
                gsub(/^"|"$/, "", pkg)
                print toupper(sev), pkg
                found=1
              }
            }
          }
          END {
            if(found) exit 1
            else exit 0
          }' "$REPORT_PATH" | tee sca_vulns.txt || true

          if [ -s sca_vulns.txt ]; then
            echo "SCA: Vulnerabilities found! (listed below)"
            cat sca_vulns.txt
            exit 1
          else
            echo "No CRITICAL/HIGH/MEDIUM vulnerabilities found."
            exit 0
          fi

      # --- Build Docker image ---
      - name: Build Docker image
        if: always()
        run: |
          docker build -t movies-app:latest .

      # --- Image Security: Trivy Scan ---
      - name: Scan Docker image with Trivy
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "movies-app:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH,MEDIUM"
