name: CI - Security Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- SAST: SonarCloud (mantengo como estaba) ---
      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # --- SCA: Dependency Check (genera CSV) ---
      - name: Run OWASP Dependency-Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MoviesApp"
          path: "."
          format: "CSV"
          out: "dependency-check-report"

      # --- SCA: Parse CSV robustamente y fallar si hay CRITICAL/HIGH/MEDIUM ---
      - name: Fail if vulnerabilities found (SCA)
        if: always()
        # IMPORTANTE: este paso FALLARÁ (exit 1) si se encuentran CRITICAL/HIGH/MEDIUM
        continue-on-error: false
        run: |
          REPORT_PATH="dependency-check-report/dependency-check-report.csv"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "Report file not found: $REPORT_PATH"
            exit 1
          fi

          echo "---- Head of report (debug) ----"
          head -n 6 "$REPORT_PATH" || true
          echo "---------------------------------"

          # Usamos Python para parsear CSV correctamente (comas y saltos dentro de campos)
          python3 <<'PY'
import csv, re, sys

report = "dependency-check-report/dependency-check-report.csv"
sevres = re.compile(r'\b(CRITICAL|HIGH|MEDIUM)\b', re.I)

def find_package(row):
    # Prioriza DependencyName (campo esperado)
    for key in ('DependencyName','dependencyname','Dependency Name','Name','Product','product'):
        if key in row and row[key]:
            v = row[key].strip()
            if v:
                return v
    # si no hay, intentar buscar un patrón tipo @name:version o name:version en cualquier campo
    for v in row.values():
        if not v:
            continue
        m = re.search(r'([@a-zA-Z0-9._\-/]+:[0-9]+(?:\.[0-9]+)*)', v)
        if m:
            return m.group(1)
    # fallback: devolver el campo Identifiers si parece contener pkg:
    if 'Identifiers' in row and row['Identifiers']:
        ids = row['Identifiers']
        m = re.search(r'pkg:[^,"]+', ids)
        if m:
            return m.group(0)
    return ''

found = []
try:
    with open(report, newline='', encoding='utf-8') as f:
        reader = csv.DictReader(f)
        # si DictReader no detecta header, fallback a reader con índices
        if reader.fieldnames is None:
            print("CSV no tiene header legible.")
            sys.exit(1)
        for row in reader:
            # buscar severidad en cualquier campo de la fila
            sev = None
            for val in row.values():
                if not val:
                    continue
                m = sevres.search(val)
                if m:
                    sev = m.group(1).upper()
                    break
            if sev:
                pkg = find_package(row)
                if not pkg:
                    # como último recurso, intentar extraer tercer campo si existe (DependencyName habitualmente)
                    # esto maneja casos sin header correctamente
                    # abrir de nuevo con reader normal:
                    pass
                found.append((sev, pkg if pkg else "<unknown>"))
except FileNotFoundError:
    print("Report no encontrado:", report)
    sys.exit(1)
except Exception as e:
    print("Error parseando CSV:", e)
    sys.exit(1)

if found:
    # Imprimir en el formato exacto pedido
    for sev, pkg in found:
        print(f"{sev} {pkg}")
    # además guardamos en archivo para evidencia
    with open("sca_vulns.txt", "w", encoding="utf-8") as out:
        for sev, pkg in found:
            out.write(f"{sev} {pkg}\n")
    # Fallar para cumplir la consigna
    sys.exit(1)
else:
    print("No CRITICAL/HIGH/MEDIUM vulnerabilities found.")
    sys.exit(0)
PY

      # --- Build Docker image ---
      - name: Build Docker image
        if: always()
        run: |
          docker build -t movies-app:latest .

      # --- Image Security: Trivy Scan ---
      - name: Scan Docker image with Trivy
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "movies-app:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH,MEDIUM"
