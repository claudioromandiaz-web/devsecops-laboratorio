name: DevSecOps Pipeline - MoviesApp

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest
    steps:
      # 1. Clonación del repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. SAST con SonarCloud (simulación)
      - name: SAST Scan (SonarCloud)
        run: |
          echo "Ejecutando análisis SAST..."
          # Simulación de falla por vulnerabilidades críticas/altas/medias
          echo "Se encontraron vulnerabilidades Críticas/Altas/Medias en el código"
          exit 1

      # 3. SCA con Dependency-Check
      - name: SCA Scan (Dependency-Check)
        run: |
          echo "Ejecutando análisis SCA..."
          # Instalar dependency-check si no está disponible
          curl -LO https://github.com/jeremylong/DependencyCheck/releases/download/v8.0.2/dependency-check-8.0.2-release.zip
          unzip dependency-check-8.0.2-release.zip
          chmod +x dependency-check/bin/dependency-check.sh
          # Ejecutar análisis (simulado)
          dependency-check/bin/dependency-check.sh --project MoviesApp --scan . --format XML --out dependency-check-report
          echo "Se encontraron vulnerabilidades Críticas/Altas/Medias en dependencias"
          exit 1

      # 4. Construcción de la imagen Docker
      - name: Build Docker Image
        run: |
          echo "Construyendo imagen Docker..."
          docker build -t moviesapp:latest .

      # 5. Image Security con Trivy
      - name: Image Security Scan (Trivy)
        run: |
          echo "Ejecutando Trivy en la imagen Docker..."
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.45.1_Linux-64bit.deb
          sudo dpkg -i trivy_0.45.1_Linux-64bit.deb
          trivy image --exit-code 1 --severity CRITICAL,HIGH,MEDIUM moviesapp:latest

