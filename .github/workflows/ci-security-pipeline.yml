name: CI - Security Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      # --- Clonar el repositorio ---
      - name: Checkout code
        uses: actions/checkout@v3

      # --- SAST Simulado ---
      - name: Simulate SAST Scan
        id: sast
        run: |
          echo "CRITICAL src/app.js:1 Some issue" > sast-report.txt
          echo "HIGH src/index.js:5 Another issue" >> sast-report.txt
          echo "MEDIUM src/utils.js:2 Minor issue" >> sast-report.txt
          echo "SAST vulnerabilities:"
          cat sast-report.txt
          if grep -E "CRITICAL|HIGH|MEDIUM" sast-report.txt; then
            exit 1
          fi

      # --- SCA: Dependency Check ---
      - name: Run OWASP Dependency-Check
        run: |
          mkdir -p dependency-check-report
          echo '"Project","ScanDate","DependencyName","Severity"' > dependency-check-report/dependency-check-report.csv
          echo '"MoviesApp","2025-10-30","@google-cloud/firestore","HIGH"' >> dependency-check-report/dependency-check-report.csv
          echo '"MoviesApp","2025-10-30","@grpc/grpc-js","HIGH"' >> dependency-check-report/dependency-check-report.csv
          echo '"MoviesApp","2025-10-30","body-parser","MEDIUM"' >> dependency-check-report/dependency-check-report.csv

      - name: Fail if SCA vulnerabilities found
        run: |
          REPORT_PATH="dependency-check-report/dependency-check-report.csv"
          echo "SCA vulnerabilities:"
          any_vulns=false
          tail -n +2 "$REPORT_PATH" | while IFS=',' read -r project date dep severity; do
            dep=$(echo $dep | tr -d '"')
            severity=$(echo $severity | tr -d '"')
            if [[ "$severity" =~ CRITICAL|HIGH|MEDIUM ]]; then
              echo "$severity $dep"
              any_vulns=true
            fi
          done
          # Verificar fuera del while para que GitHub Actions capture el exit code
          if grep -E "CRITICAL|HIGH|MEDIUM" "$REPORT_PATH"; then
            echo "SCA: Vulnerabilities found! Failing pipeline."
            exit 1
          else
            echo "No vulnerabilities found."
          fi

      # --- Build Docker Image ---
      - name: Build Docker image
        run: |
          docker build -t movies-app:latest .

      # --- Image Security: Trivy Scan ---
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "movies-app:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH,MEDIUM"
