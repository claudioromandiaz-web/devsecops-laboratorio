name: CI - Security Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:

      # --- Checkout code ---
      - name: Checkout code
        uses: actions/checkout@v3

      # --- SAST: Simulación ---
      - name: Simular vulnerabilidades SAST
        id: sast
        run: |
          echo "CRITICAL src/app.js:1 Some issue" > sast-report.txt
          echo "HIGH src/index.js:5 Another issue" >> sast-report.txt
          echo "MEDIUM src/utils.js:2 Minor issue" >> sast-report.txt

      # --- SCA: OWASP Dependency-Check ---
      - name: Run OWASP Dependency-Check
        id: sca
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MoviesApp"
          path: "."
          format: "CSV"
          out: "dependency-check-report"

      - name: Parse SCA results
        id: parse-sca
        run: |
          REPORT_PATH="dependency-check-report/dependency-check-report.csv"
          if [ -f "$REPORT_PATH" ]; then
            awk -F',' 'NR>1 && ($12=="CRITICAL"||$12=="HIGH"||$12=="MEDIUM") {gsub(/"/,"",$3); print $12 " " $3}' "$REPORT_PATH" > sca-vulns.txt
          else
            touch sca-vulns.txt
          fi

      # --- Build Docker image ---
      - name: Build Docker image
        run: |
          docker build -t movies-app:latest .

      # --- Image Security: Trivy Scan ---
      - name: Scan Docker image with Trivy
        id: trivy
        run: |
          trivy image --severity CRITICAL,HIGH,MEDIUM --exit-code 1 --format table movies-app:latest > trivy-results.txt || true

      # --- Final Step: Fail pipeline if any vulnerabilities ---
      - name: Fail if vulnerabilities found
        run: |
          any_vulns=false

          # SAST
          if [ -f sast-report.txt ] && [ -s sast-report.txt ]; then
            echo "SAST vulnerabilities:"
            cat sast-report.txt
            any_vulns=true
          fi

          # SCA
          if [ -f sca-vulns.txt ] && [ -s sca-vulns.txt ]; then
            echo "SCA vulnerabilities:"
            cat sca-vulns.txt
            any_vulns=true
          fi

          # Trivy
          if [ -f trivy-results.txt ] && [ -s trivy-results.txt ]; then
            echo "Image vulnerabilities (Trivy):"
            cat trivy-results.txt
            any_vulns=true
          fi

          if [ "$any_vulns" = true ]; then
            echo "Vulnerabilities detected. Failing pipeline."
            exit 1
          else
            echo "No vulnerabilities found."
