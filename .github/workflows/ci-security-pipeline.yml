name: CI - Security Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- SAST: Simulación ---
      - name: Run SAST Scan (Simulated)
        id: sast
        run: |
          echo "CRITICAL src/app.js:1 Some issue" > sast-vulns.txt
          echo "HIGH src/index.js:5 Another issue" >> sast-vulns.txt
          echo "MEDIUM src/utils.js:2 Minor issue" >> sast-vulns.txt
          cat sast-vulns.txt
          exit 1  # Forzar fallo para prueba

      # --- SCA: Dependency-Check ---
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MoviesApp"
          path: "."
          format: "CSV"
          out: "dependency-check-report"

      - name: Fail if SCA vulnerabilities found
        run: |
          REPORT="dependency-check-report/dependency-check-report.csv"
          if [ ! -f "$REPORT" ]; then
            echo "SCA report not found!"
            exit 1
          fi
          echo "SCA vulnerabilities:"
          grep -E "CRITICAL|HIGH|MEDIUM" "$REPORT" | awk -F',' 'NR>1 {gsub(/"/,"",$3); gsub(/"/,"",$19); print $19, $3}' 
          if grep -q -E "CRITICAL|HIGH|MEDIUM" "$REPORT"; then
            exit 1
          fi

      # --- Build Docker image ---
      - name: Build Docker image
        run: docker build -t movies-app:latest .

      # --- Image Security: Trivy Scan ---
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "movies-app:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH,MEDIUM"
