name: CI - Security Pipeline (final)

on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install npm dependencies
        run: npm install

      # ---------------------
      # SAST (ESLint) - run but don't stop the pipeline
      # ---------------------
      - name: Run ESLint (SAST) and save output
        run: |
          npm install eslint@8 --no-audit --no-fund --silent --save-dev || true
          npx eslint . -f unix > eslint-output.txt 2>&1 || true
          echo "=== ESLint head ==="
          head -n 30 eslint-output.txt || true

      - name: Create SAST report flag (detect eslint errors)
        run: |
          # If eslint output contains "error" mark as SAST vuln and write summary
          if grep -E "error" -i eslint-output.txt >/dev/null 2>&1; then
            grep -E "error" -i eslint-output.txt | sed -n '1,200p' > sast-vulns.txt
            echo "SAST vulnerabilities found" >&2
          else
            touch sast-vulns.txt
            echo "No SAST errors found"
          fi

      # ---------------------
      # SCA: OWASP Dependency-Check (writes CSV report)
      # ---------------------
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MoviesApp"
          path: "."
          format: "CSV"
          out: "dependency-check-report"
        # let pipeline continue even if this action returns non-zero
        continue-on-error: true

      - name: Parse Dependency-Check CSV (robust) -> sca-vulns.txt
        run: |
          REPORT="dependency-check-report/dependency-check-report.csv"
          python3 - <<'PY'
          import csv, re, sys
          report = "dependency-check-report/dependency-check-report.csv"
          out = "sca-vulns.txt"
          found = []
          sev_re = re.compile(r'\b(CRITICAL|HIGH|MEDIUM)\b', re.I)
try:
    with open(report, newline='', encoding='utf-8') as f:
        reader = csv.DictReader(f)
        if reader.fieldnames is None:
            # fallback: try to read as plain CSV rows
            f.seek(0)
            for line in f:
                if sev_re.search(line):
                    # crude extraction: try to pull dependency name like package:version
                    m = re.search(r'([@a-zA-Z0-9._\-/]+:[0-9]+\.[0-9]+)', line)
                    s = sev_re.search(line).group(1).upper()
                    pkg = m.group(1) if m else "<unknown>"
                    found.append((s, pkg))
        else:
            for row in reader:
                # find severity anywhere in the row
                sev = None
                for v in row.values():
                    if not v:
                        continue
                    m = sev_re.search(str(v))
                    if m:
                        sev = m.group(1).upper()
                        break
                if sev:
                    # try common column names for dependency
                    pkg = ""
                    for key in row:
                        if key.lower() in ("dependencyname","dependency name","dependency","name","product"):
                            pkg = row.get(key,"").strip()
                            if pkg:
                                break
                    # fallback: look in Identifiers or any field for pkg:version
                    if not pkg:
                        for v in row.values():
                            if not v: continue
                            m = re.search(r'([@a-zA-Z0-9._\-/]+:[0-9]+\.[0-9]+)', str(v))
                            if m:
                                pkg = m.group(1)
                                break
                    if not pkg:
                        pkg = "<unknown>"
                    found.append((sev, pkg))
except FileNotFoundError:
    # no report
    pass
except Exception as e:
    print("ERROR parsing CSV:", e, file=sys.stderr)

with open(out, "w", encoding="utf-8") as o:
    for sev,pkg in found:
        o.write(f"{sev} {pkg}\n")
# print to stdout for logs
if found:
    for sev,pkg in found:
        print(f"{sev} {pkg}")
PY
          echo "---- SCA parse done ----"
          ls -la sca-vulns.txt || true
          head -n 200 sca-vulns.txt || true

      # ---------------------
      # Build Docker image
      # ---------------------
      - name: Build Docker image
        run: docker build -t movies-app:latest .

      # ---------------------
      # Image Security: Trivy via Docker (create trivy.json and trivy-vulns.txt)
      # Use official trivy container so no extra installs required
      # ---------------------
      - name: Run Trivy (container) and save JSON
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity CRITICAL,HIGH,MEDIUM --format json --output trivy.json movies-app:latest || true
          python3 - <<'PY'
import json,sys
out_txt = "trivy-vulns.txt"
try:
    data = json.load(open("trivy.json","r"))
except Exception:
    data = None
vuls = []
if data:
    # Trivy JSON has list of results; each result may have "Vulnerabilities"
    for res in data.get("Results", []) if "Results" in data else data:
        for v in res.get("Vulnerabilities", []) if isinstance(res, dict) else []:
            sev = v.get("Severity","").upper()
            pkg = v.get("PkgName","")
            ver = v.get("InstalledVersion","") or v.get("PkgVersion","")
            if sev and pkg:
                vuls.append((sev, f"{pkg}:{ver}" if ver else pkg))
with open(out_txt,"w",encoding="utf-8") as o:
    for sev,pkg in vuls:
        o.write(f"{sev} {pkg}\n")
if vuls:
    for sev,pkg in vuls:
        print(f"{sev} {pkg}")
PY
          echo "---- Trivy parse done ----"
          ls -la trivy-vulns.txt || true
          head -n 200 trivy-vulns.txt || true

      # ---------------------
      # Final: show all, fail if any vuln found
      # ---------------------
      - name: Consolidate reports and fail if needed
        run: |
          echo "---- Final check: SAST / SCA / IMAGE ----"
          any=false
          if [ -f sast-vulns.txt ] && [ -s sast-vulns.txt ]; then
            echo "SAST vulnerabilities:"
            sed -n '1,200p' sast-vulns.txt
            any=true
          fi
          if [ -f sca-vulns.txt ] && [ -s sca-vulns.txt ]; then
            echo "SCA vulnerabilities:"
            sed -n '1,200p' sca-vulns.txt
            any=true
          fi
          if [ -f trivy-vulns.txt ] && [ -s trivy-vulns.txt ]; then
            echo "Image vulnerabilities (Trivy):"
            sed -n '1,200p' trivy-vulns.txt
            any=true
          fi
          if [ "$any" = true ]; then
            echo "::error::Vulnerabilities detected (SAST or SCA or Image). Failing pipeline as required."
            exit 1
          else
            echo "No vulnerabilities found."
            exit 0
          fi
