name: MoviesApp DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  devsecops:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_NAME: moviesapp:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # ------------------------------
      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      # ------------------------------
      # SAST: ESLint
      - name: Setup ESLint config
        run: |
          echo '{
            "env": {"browser": true,"node": true,"es2021": true},
            "extends": "eslint:recommended",
            "parserOptions": {"ecmaVersion": 12,"sourceType": "module"},
            "rules": {"no-unused-vars": "error","no-console": "warn"}
          }' > .eslintrc.json

      - name: Run ESLint
        run: npx eslint . --max-warnings=0

      # ------------------------------
      # SCA: Dependency-Check
      - name: Install Dependency-Check
        run: sudo apt-get update && sudo apt-get install -y dependency-check

      - name: Run Dependency-Check
        run: |
          dependency-check --project MoviesApp --scan ./ --out dependency-check-report --format "ALL"
          cat dependency-check-report/dependency-check-report.html
        continue-on-error: false

      # ------------------------------
      # Build Docker Image
      - name: Build Docker Image
        run: docker build -t $DOCKER_IMAGE_NAME .

      # ------------------------------
      # Image Security Scan: Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.45.1_Linux-64bit.deb
          sudo dpkg -i trivy_0.45.1_Linux-64bit.deb

      - name: Scan Docker Image with Trivy
        run: trivy image --exit-code 1 --severity CRITICAL,HIGH,MEDIUM $DOCKER_IMAGE_NAME
