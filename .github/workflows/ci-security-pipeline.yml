name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
      - '**'   # cualquier rama
  pull_request:
    branches:
      - main

jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    # --------------------------
    # SAST: ESLint
    # --------------------------
    - name: Setup ESLint config
      run: |
        echo '{
          "env": {"browser": true,"node": true,"es2021": true},
          "extends": "eslint:recommended",
          "parserOptions": {"ecmaVersion": 12,"sourceType": "module"},
          "rules": {"no-unused-vars": "error","no-console": "warn"}
        }' > .eslintrc.json

    - name: Run ESLint SAST
      run: npx eslint . --max-warnings=0

    # --------------------------
    # SCA: Dependency Check
    # --------------------------
    - name: Install Dependency-Check
      run: npm install -g dependency-check

    - name: Run Dependency Check
      run: |
        mkdir -p dependency-check-report
        dependency-check --out dependency-check-report/dependency-check-report.json --json
        # Fail on Critical/High/Medium
        if grep -qE '"vulnerability":.*"(CRITICAL|HIGH|MEDIUM)"' dependency-check-report/dependency-check-report.json; then
          echo "SCA found vulnerabilities. Failing pipeline."
          exit 1
        fi

    # --------------------------
    # Docker Build
    # --------------------------
    - name: Build Docker image
      run: docker build -t moviesapp:latest .

    # --------------------------
    # Image Security: Trivy
    # --------------------------
    - name: Scan Docker image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: moviesapp:latest
        severity: CRITICAL,HIGH,MEDIUM
        exit-code: 1

