name: CI - Security Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- SAST: SonarCloud ---
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      - name: Wait for SonarCloud Quality Gate
        uses: sonarsource/sonarcloud-quality-gate-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # --- SCA: OWASP Dependency-Check ---
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MoviesApp"
          path: "."
          format: "CSV"
          out: "dependency-check-report"

      # --- SCA: Fail if vulnerabilities found ---
      - name: Fail if vulnerabilities found (SCA)
        if: always()
        continue-on-error: true
        run: |
          REPORT_PATH="dependency-check-report/dependency-check-report.csv"
          if [ -f "$REPORT_PATH" ]; then
            if grep -q -E "CRITICAL|HIGH|MEDIUM" "$REPORT_PATH"; then
              echo "SCA: Vulnerabilities found! Failing pipeline."
              echo "---- Vulnerabilities detected ----"
              # awk corregido: busca severidad en cualquier columna y limpia comillas
              awk -F',' '{
                gsub(/"/,"",$2)
                sev=""
                for(i=1;i<=NF;i++){
                  f=$i
                  gsub(/"/,"",f)
                  if(toupper(f) ~ /CRITICAL|HIGH|MEDIUM/){
                    sev=toupper(f)
                    break
                  }
                }
                if(sev != ""){
                  print sev, $2
                }
              }' "$REPORT_PATH"
              echo "----------------------------------"
              exit 1
            else
              echo "No vulnerabilities found."
            fi
          else
            echo "Report file not found!"
            exit 1
          fi

      # --- Build Docker image ---
      - name: Build Docker image
        if: always()
        run: |
          docker build -t movies-app:latest .

      # --- Image Security: Trivy Scan ---
      - name: Scan Docker image with Trivy
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "movies-app:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH,MEDIUM"
