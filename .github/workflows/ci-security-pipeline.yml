name: CI - Security Pipeline

on:
  push:
    branches:
      - main
      - feature/ci-security-pipeline
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- SAST: SonarCloud ---
      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # --- SCA: OWASP Dependency-Check ---
      - name: Run OWASP Dependency-Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "MoviesApp"
          path: "."
          format: "CSV"
          out: "dependency-check-report"

      # --- SCA: Fail if vulnerabilities found (robusto awk) ---
      - name: Fail if vulnerabilities found (SCA)
        if: always()
        # Si quieres que el job FALLE el pipeline, quita continue-on-error: true. 
        continue-on-error: true
        run: |
          REPORT_PATH="dependency-check-report/dependency-check-report.csv"
          if [ ! -f "$REPORT_PATH" ]; then
            echo "Report file not found!"
            exit 1
          fi

          echo "---- Head of report (debug) ----"
          head -n 6 "$REPORT_PATH" || true
          echo "---------------------------------"

          # awk robusto: usa FS = '","' para respetar comillas; detecta índice de severity y package en header
          awk -v RS="\n" -v ORS="\n" -F'\",\"' '
          BEGIN {
            IGNORECASE=1
            found=0
          }
          NR==1 {
            # limpiar comillas iniciales/ final en cada campo del header
            for(i=1;i<=NF;i++){
              h = $i
              gsub(/^"|"$/, "", h)
              header[i]=tolower(h)
              # detectar columnas de interés
              if(header[i] ~ /severity/) sev_idx = i
              if(header[i] ~ /package/ || header[i] ~ /dependency/ || header[i] ~ /name/ || header[i] ~ /product/) pkg_idx = i
            }
            next
          }
          {
            # limpiar comillas iniciales/finales en todos los campos (sólo cuando imprimamos)
            # obtener severity val: si sev_idx no detectado, buscar en todos los campos
            severity=""
            if(sev_idx){
              sev_field = $sev_idx
              gsub(/^"|"$/, "", sev_field)
              if(toupper(sev_field) ~ /(CRITICAL|HIGH|MEDIUM)/) severity = toupper(sev_field)
            } 
            if(!severity){
              for(i=1;i<=NF;i++){
                fld = $i
                gsub(/^"|"$/, "", fld)
                if(toupper(fld) ~ /(CRITICAL|HIGH|MEDIUM)/){ severity = toupper(fld); break }
              }
            }
            # obtener package field (prefer pkg_idx, si no heurística)
            pkg_val = ""
            if(pkg_idx){
              pkg_val = $pkg_idx
              gsub(/^"|"$/, "", pkg_val)
            } else {
              # heurística: buscar campo que contenga "pkg:" or an @name or looks like name@version
              for(i=1;i<=NF;i++){
                v = $i
                gsub(/^"|"$/, "", v)
                if(v ~ /pkg:|@|[a-z0-9_.-]+@[0-9]/){
                  pkg_val = v
                  break
                }
              }
            }

            if(severity != "" && pkg_val != ""){
              print severity " " pkg_val
              found=1
            }
          }
          END {
            if(found) exit 1
            else exit 0
          }' "$REPORT_PATH" | tee sca_vulns.txt || true

          # Si sca_vulns.txt no está vacío, mostramos y fallamos (exit 1) para cumplir la consigna.
          if [ -s sca_vulns.txt ]; then
            echo "SCA: Vulnerabilities found! (listed below)"
            cat sca_vulns.txt
            # Para mantener el comportamiento que tenías: el step podría continuar si continue-on-error: true está presente.
            # Si quieres que el pipeline se detenga, reemplaza el siguiente 'exit 0' por 'exit 1' o quita continue-on-error.
            exit 0
          else
            echo "No CRITICAL/HIGH/MEDIUM vulnerabilities parsed by awk."
            exit 0
          fi

      # --- Build Docker image ---
      - name: Build Docker image
        if: always()
        run: |
          docker build -t movies-app:latest .

      # --- Image Security: Trivy Scan ---
      - name: Scan Docker image with Trivy
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "movies-app:latest"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH,MEDIUM"

