name: CI - Security Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install

      - name: Run ESLint (SAST)
        run: |
          npm install eslint@8 --save-dev
          npx eslint . || true
          # Force failure for demo
          echo "CRITICAL app/secrets.js: hardcoded-secret"
          echo "HIGH src/unsafe.js: insecure-eval"
          echo "MEDIUM lib/util.js: weak-validation"
          exit 1

  sca:
    runs-on: ubuntu-latest
    needs: sast
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run npm audit (SCA)
        run: |
          npm audit --json > audit.json
          python3 <<'PY'
          import json, sys
          with open("audit.json") as f:
          data = json.load(f)
          vulns = []
for pkg, info in data.get("advisories", {}).items():
    sev = info.get("severity", "").upper()
    if sev in ("CRITICAL","HIGH","MEDIUM"):
        vulns.append((sev, info.get("module_name","<unknown>")))
for sev, pkg in vulns:
    print(f"{sev} {pkg}")
if vulns:
    sys.exit(1)
PY

  image:
    runs-on: ubuntu-latest
    needs: sca
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t movies-app:test .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: movies-app:test
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH,MEDIUM
